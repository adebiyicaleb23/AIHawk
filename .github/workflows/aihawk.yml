name: AIHawk Auto-Apply

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-apply:
    name: Auto-Apply to Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LINKEDIN_EMAIL: ${{ secrets.MY_EMAIL }}
      LINKEDIN_PASSWORD: ${{ secrets.MY_EMAIL_PASSWORD }}
      APPLICATION_EMAIL: ${{ secrets.MY_EMAIL }}
      GEMINI_API_ACCESS: ${{ secrets.GEMINI_API_ACCESS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_NAME: ${{ secrets.GEMINI_API_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright & Browser Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Prepare configuration files
        run: |
          mkdir -p data_folder
          python -c "
          import os, yaml
          key = os.environ.get('GEMINI_API_KEY') or os.environ.get('GEMINI_API_ACCESS') or os.environ.get('GEMINI_API_NAME')
          with open('data_folder/secrets.yaml', 'w') as f:
              yaml.dump({'llm_api_key': key}, f)
          "
          cp data_folder_example/work_preferences.yaml data_folder/
          cp data_folder_example/plain_text_resume.yaml data_folder/
          if [ -n "$APPLICATION_EMAIL" ]; then
            sed -i "s/adebiyicaleb222@gmail.com/$APPLICATION_EMAIL/g" data_folder/plain_text_resume.yaml
          fi
          echo "Configuration prepared successfully."

      - name: Run AIHawk (headless)
        run: |
          python main.py --headless
        env:
          LINKEDIN_EMAIL: ${{ secrets.MY_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.MY_EMAIL_PASSWORD }}

      - name: Upload application results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aihawk-results-${{ github.run_id }}
          path: |
            job_applications/
            data_folder/output/
            log/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## AIHawk Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data_folder/output/success.json ]; then
            APPLIED=$(jq length data_folder/output/success.json 2>/dev/null || echo 0)
            echo "- **Applied:** $APPLIED jobs" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data_folder/output/failed.json ]; then
            FAILED=$(jq length data_folder/output/failed.json 2>/dev/null || echo 0)
            echo "- **Failed:** $FAILED jobs" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data_folder/output/skipped.json ]; then
            SKIPPED=$(jq length data_folder/output/skipped.json 2>/dev/null || echo 0)
            echo "- **Skipped:** $SKIPPED jobs" >> $GITHUB_STEP_SUMMARY
          fi
