name: Run ApplyPilot

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  run-applypilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ApplyPilot and Dependencies
        run: |
          pip install --upgrade pip
          pip install applypilot
          pip install --no-deps python-jobspy
          pip install pydantic tls-client requests markdownify regex curl_cffi
          playwright install --with-deps chromium

      - name: Copy Profile, Resume, and Searches
        run: |
          mkdir -p /home/runner/.applypilot
          cp profile.json /home/runner/.applypilot/
          cp searches.yaml /home/runner/.applypilot/
          cp resume.txt /home/runner/.applypilot/
          cp resume.pdf /home/runner/.applypilot/ 2>/dev/null || true

      - name: Run ApplyPilot Pipeline
        env:
          APPLYPILOT_DIR: /home/runner/.applypilot
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          LLM_MODEL: gemini-3.1-flash-lite
          PYTHONUNBUFFERED: "1"
        run: |
          python key_rotator.py run --min-score 5 --validation lenient

      - name: Upload Tailored Resumes & Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailored-resumes
          path: |
            /home/runner/.applypilot/tailored_resumes/
            /home/runner/.applypilot/cover_letters/
            /home/runner/.applypilot/applypilot.db
          if-no-files-found: ignore
