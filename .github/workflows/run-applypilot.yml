name: Run ApplyPilot

on:
  schedule:
    # Runs every day at 08:00 UTC (9:00 AM West Africa Time)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to click a button to run it manually anytime
    inputs:
      stages:
        description: 'Stages to run (e.g. all, or discover enrich score tailor)'
        required: false
        default: 'all'
      min_score:
        description: 'Minimum fit score (1-10)'
        required: false
        default: '7'

jobs:
  applypilot-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APPLYPILOT_DIR: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2

      - name: Install ApplyPilot & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install applypilot
          pip install --no-deps python-jobspy
          pip install pydantic tls-client requests markdownify regex curl_cffi
          playwright install --with-deps chromium

      - name: Verify ApplyPilot Environment (Doctor)
        run: |
          # Copy files to ~/.applypilot as backup fallback for both paths
          mkdir -p ~/.applypilot
          cp profile.json searches.yaml resume.txt ~/.applypilot/ 2>/dev/null || true
          cp resume.pdf ~/.applypilot/ 2>/dev/null || true
          python -m applypilot doctor

      - name: Run ApplyPilot Pipeline
        run: |
          STAGES="${{ github.event.inputs.stages || 'all' }}"
          MIN_SCORE="${{ github.event.inputs.min_score || '7' }}"
          echo "Running ApplyPilot stages: $STAGES (min score: $MIN_SCORE)"
          python -m applypilot run $STAGES --min-score $MIN_SCORE --validation normal

      - name: Upload Tailored Resumes & Database Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applypilot-output
          path: |
            tailored_resumes/
            cover_letters/
            applypilot.db
            logs/
          if-no-files-found: ignore
