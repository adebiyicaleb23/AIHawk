[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applypilot"
version = "2.0.0"
description = "ApplyPilot - Automated job application system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "applypilot",
    "python-jobspy",
    "pydantic",
    "tls-client",
    "requests",
    "markdownify",
    "regex",
    "curl_cffi",
    "playwright",
    "pyyaml",
    "rich",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["applypilot*"]

[tool.pytest.ini_options]
testpaths = ["applypilot/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true